  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Ambient Glows -->
  <div class="ambient-glow glow-top-left" aria-hidden="true"></div>
  <div class="ambient-glow glow-hero-right" aria-hidden="true"></div>

  <!-- Header / Navbar -->
  <header class="header-wrapper" id="headerWrapper">
    <nav class="navbar" aria-label="Main Navigation">
      <a href="index.html" class="nav-brand">
        <img src="assets/avatar.png" alt="Cristian Muñoz" class="nav-avatar">
        <span class="nav-brand-text">Cristian Muñoz</span>
      </a>

      <ul class="nav-menu">
        <li class="nav-item">
          <a href="index.html#home" class="nav-link">Home</a>
        </li>
        <li class="nav-item">
          <a href="skills.html" class="nav-link">Skills</a>
        </li>
        <li class="nav-item nav-dropdown">
          <a href="portfolio.html" class="nav-link">
            Portfolio <span class="nav-arrow">&#9662;</span>
          </a>
          <ul class="dropdown-menu">
            <li><a href="portfolio.html#all" class="dropdown-item">All Projects</a></li>
            <li><a href="portfolio.html#eventos" class="dropdown-item">Eventos Premium</a></li>
            <li><a href="portfolio.html#portal" class="dropdown-item">Mi Portal U</a></li>
            <li><a href="portfolio.html#acapp" class="dropdown-item">A&amp;C App</a></li>
          </ul>
        </li>
        <li class="nav-item">

        </li>
      </ul>

      <a href="contact.html" class="btn-nav-contact" style="background: #4f51e8;">Contact Me</a>
    </nav>
  </header>

  <main>
    <div class="subpage-hero">
      <h1 class="subpage-hero-title">Let's Work Together</h1>
      <p class="subpage-hero-subtitle">Have a project in mind or want to discuss design? Feel free to reach out directly.</p>
    </div>

    <div class="contact-card">
      <form action="#" method="get">
        <div class="form-group">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Cristian Muñoz" required>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="e.g. contact@example.com" required>
        </div>

        <div class="form-group">
          <label for="projectType" class="form-label">Project Type</label>
          <select id="projectType" name="projectType" class="form-input" style="cursor: pointer;">
            <option value="ui">UI/UX Interface Design</option>
            <option value="design-system">Design System Architecture</option>
            <option value="prototype">Interactive Prototype</option>
            <option value="audit">UX Usability Audit</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" name="message" rows="5" class="form-textarea" placeholder="Describe your project, goals, and timeline..." required></textarea>
        </div>

        <button type="submit" class="btn-form-submit">
          Send Message <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <ul class="social-links" aria-label="Social links">
        <li><a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
        <li><a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a></li>
        <li><a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a></li>
        <li><a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a></li>
      </ul>
      <p class="footer-copyright">
        Cristian David Muñoz Camayo @kianmuñoz &copy; 2022
      </p>
    </div>
  </footer>

</body>
</html>
